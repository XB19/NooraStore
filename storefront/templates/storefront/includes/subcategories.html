<section class="subcats">
  <div class="wrap">
    <div class="shead"><div><span class="kicker">Vêtements</span><h2>Par catégorie</h2></div></div>
    <div class="subcat-grid">
      {% for sub in vetements_subcategories %}
      <a class="subcat-card" href="{{ sub.get_absolute_url }}">
        {% if sub.image %}<img src="{{ sub.image.url }}" alt="{{ sub.name }}">{% endif %}
        <div class="shade"></div>
        <div class="content"><h4>{{ sub.name }}</h4><span class="arrow"><svg class="icon" style="width:14px;height:14px; color:#fff;" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></span></div>
      </a>
      {% endfor %}
    </div>
  </div>
</section>
