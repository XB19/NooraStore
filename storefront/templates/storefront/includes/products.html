<section class="products">
  <div class="wrap">
    <div class="shead">
      <div><span class="kicker">Catalogue</span><h2>Nos meilleures ventes</h2></div>
      <a href="{% url 'catalog:catalogue' %}" class="more">Tout le catalogue <svg class="icon" style="width:14px;height:14px;" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>
    </div>
    {% if featured_products %}
    <div class="pgrid">
      {% for p in featured_products %}
        {% include "catalog/includes/product_card.html" %}
      {% endfor %}
    </div>
    {% else %}
    <p style="color:var(--ink-soft);">Le catalogue est en cours de préparation, revenez bientôt.</p>
    {% endif %}
  </div>
</section>
